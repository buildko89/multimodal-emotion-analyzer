# meta-ara-demo: packages the device-verified V25 ARA demo into an NXP i.MX BSP image.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ara-demo"
BBFILE_PATTERN_ara-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_ara-demo = "10"

LAYERDEPENDS_ara-demo = "core freescale-layer"
LAYERSERIES_COMPAT_ara-demo = "wrynose"

# Directory on the build host holding the payload tarballs and payload_manifest.json
# produced by tools/harvest_device_payload.py.  Set it in conf/local.conf.
ARA_DEMO_PAYLOAD_DIR ??= ""
